title = "SIL gitleaks config"
[extend]
useDefault = true

[[rules]]
id = "sil-db-connection-string"
description = "Database URL with embedded credentials"
regex = '''(?i)(postgres(ql)?|mysql|mongodb(\+srv)?|redis|amqp|mssql)://[^\s:@/]+:[^\s@/]+@[^\s'"]+'''
tags = ["database", "credential"]

[[rules]]
id = "sil-kc-client-secret"
description = "Keycloak/OIDC client secret assignment"
regex = '''(?i)client[_-]?secret["']?\s*[:=]\s*["']?[A-Za-z0-9_\-]{16,}'''

[allowlist]
description = "Demo placeholders only"
paths = ['''infra/\.env\.example''', '''infra/keycloak/realm\.json''', '''demo/.*''', '''guardrails/tests/.*''', '''scripts/.*''', '''evidence/.*''']
